name: Build iboxhook.dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile hook.mm -> dylib (HWBP, no dobby)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -install_name "@rpath/iboxhook.dylib" \
            hook.mm \
            -o iboxhook.dylib
          file iboxhook.dylib
          otool -L iboxhook.dylib
          ls -la iboxhook.dylib
          ! otool -L iboxhook.dylib | grep -i substrate

      - name: Fake-sign with ldid
        run: |
          brew install ldid || true
          ldid -S iboxhook.dylib || true
          ls -la iboxhook.dylib
          file iboxhook.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iboxhook-dylib
          path: iboxhook.dylib
          if-no-files-found: error
