name: Build iboxhook.dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. 直接下 Dobby 官方预编译 iOS arm64 静态库 (免 CMake 交叉编译)
      #    jmpews/Dobby releases/latest -> dobby-iphoneos-all.tar.gz
      #    里面有 build/iphoneos/arm64/libdobby.a + build/iphoneos/dobby.h
      # ---------------------------------------------------------------
      - name: Fetch prebuilt Dobby (iOS arm64 static)
        run: |
          curl -sL "https://github.com/jmpews/Dobby/releases/download/latest/dobby-iphoneos-all.tar.gz" -o dobby-ios.tar.gz
          mkdir -p dobby-ios
          tar -xzf dobby-ios.tar.gz -C dobby-ios
          cp dobby-ios/build/iphoneos/arm64/libdobby.a "$GITHUB_WORKSPACE/libdobby.a"
          cp dobby-ios/build/iphoneos/dobby.h          "$GITHUB_WORKSPACE/dobby.h"
          echo "=== libdobby.a ==="
          ls -la "$GITHUB_WORKSPACE/libdobby.a"
          file "$GITHUB_WORKSPACE/libdobby.a"
          lipo -info "$GITHUB_WORKSPACE/libdobby.a" || true
          echo "=== dobby.h ==="
          head -5 "$GITHUB_WORKSPACE/dobby.h"

      # ---------------------------------------------------------------
      # 2. 编译 hook.mm -> iboxhook.dylib (静态链接 Dobby, 裸 dylib 无 substrate)
      # ---------------------------------------------------------------
      - name: Compile hook.mm -> dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc \
            -dynamiclib \
            -I"$GITHUB_WORKSPACE" \
            -framework Foundation -framework UIKit \
            -Wl,-no_warn_duplicate_libraries \
            -install_name "@rpath/iboxhook.dylib" \
            hook.mm "$GITHUB_WORKSPACE/libdobby.a" \
            -o iboxhook.dylib
          echo "=== 编译完成 ==="
          file iboxhook.dylib
          otool -L iboxhook.dylib
          otool -l iboxhook.dylib | grep -A2 LC_ID_DYLIB

      # ---------------------------------------------------------------
      # 3. ldid 伪签名 (sideload 前重签工具会重新签, 这里先自签保证结构完整)
      # ---------------------------------------------------------------
      - name: Fake-sign with ldid
        run: |
          brew install ldid || true
          ldid -S iboxhook.dylib || true
          echo "=== 最终产物 ==="
          ls -la iboxhook.dylib
          file iboxhook.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iboxhook-dylib
          path: iboxhook.dylib
          if-no-files-found: error
