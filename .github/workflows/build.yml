name: Build iboxhook.dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch prebuilt Dobby (iOS arm64 static)
        run: |
          set -e
          curl -sL "https://github.com/jmpews/Dobby/releases/download/latest/dobby-iphoneos-all.tar.gz" -o dobby-ios.tar.gz
          mkdir -p dobby-ios
          tar -xzf dobby-ios.tar.gz -C dobby-ios
          # 兼容不同解压布局
          LIB=$(find dobby-ios -name 'libdobby.a' | head -1)
          HDR=$(find dobby-ios -name 'dobby.h' | head -1)
          if [ -z "$LIB" ] || [ -z "$HDR" ]; then
            echo "Dobby 预编译包结构变了, 列目录:"
            find dobby-ios -maxdepth 5 -type f | head -50
            exit 1
          fi
          cp "$LIB" "$GITHUB_WORKSPACE/libdobby.a"
          cp "$HDR" "$GITHUB_WORKSPACE/dobby.h"
          ls -la "$GITHUB_WORKSPACE/libdobby.a" "$GITHUB_WORKSPACE/dobby.h"
          lipo -info "$GITHUB_WORKSPACE/libdobby.a" || true
          file "$GITHUB_WORKSPACE/libdobby.a"

      - name: Compile hook.mm -> dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            -I"$GITHUB_WORKSPACE" \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -install_name "@rpath/iboxhook.dylib" \
            hook.mm "$GITHUB_WORKSPACE/libdobby.a" \
            -o iboxhook.dylib
          file iboxhook.dylib
          otool -L iboxhook.dylib
          otool -l iboxhook.dylib | grep -A2 LC_ID_DYLIB || true
          ls -la iboxhook.dylib

      - name: Fake-sign with ldid
        run: |
          brew install ldid || true
          ldid -S iboxhook.dylib || true
          ls -la iboxhook.dylib
          file iboxhook.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iboxhook-dylib
          path: iboxhook.dylib
          if-no-files-found: error
